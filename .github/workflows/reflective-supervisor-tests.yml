name: Reflective Supervisor Tests

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reflective-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run reflective supervisor tests
        run: |
          uv run pytest \
            tests/agent/test_trajectory_tracer.py \
            tests/agent/test_execution_verifier.py \
            tests/agent/test_reflection_memory.py \
            tests/agent/test_replan_gate.py \
            tests/utils/test_trajectory_eval.py \
            tests/utils/test_preference_export.py
